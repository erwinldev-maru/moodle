name: Deploy Moodle to AWS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Zip Moodle Code
        run: zip -r moodle-deployment.zip . -x "*.git*" ".github/*"

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application-name: MaruMoodleLMS
          environment-name: MaruMoodle-Prod-v2
          aws-region: ap-southeast-2
          version-label: "moodle-${{ github.run_number }}"
          deployment-package: moodle-deployment.zip
